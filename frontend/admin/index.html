<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Portfolio</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#3b82f6"/>
        <path d="M12 28V14h5l3 8 3-8h5v14h-4v-8l-2.5 6h-3L16 20v8h-4z" fill="#fff"/>
      </svg>
      <span>Portfolio Admin</span>
    </div>
    <h1 class="login-title">Sign In</h1>
    <p class="login-sub">Enter your credentials to access the dashboard.</p>

    <div id="loginAlert" class="alert alert-error hidden"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               placeholder="admin" required />
        <span class="field-error" id="usernameErr"></span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="••••••••" required />
          <button type="button" class="toggle-pw" aria-label="Toggle password" onclick="togglePw()">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="field-error" id="passwordErr"></span>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
        <span id="loginBtnText">Sign In</span>
        <span id="loginSpinner" class="spinner hidden"></span>
      </button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
